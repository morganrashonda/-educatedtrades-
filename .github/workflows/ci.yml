name: CI — Tests, Import Check & Dry-Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Import check — treat deprecation warnings as errors
        run: python -W error::DeprecationWarning scripts/ci_import_check.py

      # The two primary suites are stdlib scripts, not pytest modules: they
      # execute at import and exit with a status. Run them directly so a
      # failure fails the build, rather than relying on pytest collection.
      - name: Safety and integrity suite
        run: python backend/tests/test_suite.py

      - name: End-to-end integration
        run: python backend/tests/test_end_to_end.py

      - name: Remaining pytest tests
        run: >-
          python -m pytest -q -p no:cacheprovider backend/tests
          --ignore=backend/tests/test_suite.py
          --ignore=backend/tests/test_end_to_end.py

      - name: Dry-run — one cycle in simulate mode
        env:
          # The control API can change mode and place trades, so the process
          # refuses to start without a token on EVERY startup path. Without
          # this the dry-run exits immediately and the greps below silently
          # find nothing -- which is how a green build can mean nothing ran.
          API_AUTH_TOKEN: ci-dry-run-not-a-real-secret
          # Keep CI out of the default data root and off any real credentials.
          DATA_ROOT: /tmp/ci-data
          API_BIND: 127.0.0.1
        run: |
          cd backend
          python main.py --simulate > /tmp/ci_dryrun.log 2>&1 &
          CI_PID=$!
          cleanup() {
            kill "$CI_PID" 2>/dev/null || true
            wait "$CI_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3099/api/status \
              -H "Authorization: Bearer ${API_AUTH_TOKEN}" \
              -o /tmp/ci_status.json; then
              READY=1
              break
            fi
            kill -0 "$CI_PID" 2>/dev/null \
              || { echo "FAIL: orchestrator exited"; cat /tmp/ci_dryrun.log; exit 1; }
            sleep 1
          done
          [ "$READY" -eq 1 ] \
            || { echo "FAIL: authenticated API never became ready"; cat /tmp/ci_dryrun.log; exit 1; }

          CYCLE=0
          for _ in $(seq 1 30); do
            if grep -q "Cycle #1 complete" /tmp/ci_dryrun.log; then
              CYCLE=1
              break
            fi
            sleep 1
          done
          [ "$CYCLE" -eq 1 ] \
            || { echo "FAIL: first pipeline cycle never completed"; cat /tmp/ci_dryrun.log; exit 1; }
          grep -q "Orchestrator started" /tmp/ci_dryrun.log \
            || { echo "FAIL: startup milestone missing"; cat /tmp/ci_dryrun.log; exit 1; }
          python -c 'import json; d=json.load(open("/tmp/ci_status.json")); assert d["status"] == "running"; assert d["orchestrator"]["running"] is True'
          echo "Dry-run complete: authenticated API ready and cycle 1 completed"
